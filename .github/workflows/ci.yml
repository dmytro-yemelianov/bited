name: Portable Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep Rust state outside checkout and isolated from other raps-ci runners.
  CARGO_HOME: ${{ github.workspace }}/../.cargo-home
  RUSTUP_HOME: ${{ github.workspace }}/../.rustup-home

concurrency:
  group: portable-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-wasip1, riscv32imac-unknown-none-elf
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Tests and examples
        run: |
          cargo test --locked --offline
          cargo test --locked --offline --release
          cargo run --locked --offline --example buffer
          cargo run --locked --offline --example stream
          cargo run --locked --offline --example deltas
      - name: no_std target compilation
        run: |
          cargo check --locked --offline --lib --target wasm32-wasip1
          cargo check --locked --offline --lib --target riscv32imac-unknown-none-elf
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --offline --no-deps
