[package]
name = "varint-comparison"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "varint-comparison"

[dependencies]
verified-varint-baseline = { path = "baseline" }
libc = "=0.2.177"
bitet = { path = "../.." }
leb128 = "=0.2.5"
integer-encoding = { version = "=4.1.0", default-features = false }
serde_json = "=1.0.145"

[profile.release]
overflow-checks = true
debug = 1
